<!doctype html>
<html lang="en" class="light" data-theme="light" data-style="orbit">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090909" media="(prefers-color-scheme: dark)" />
    <title>Epure</title>
    <script>
      try {
        const m = localStorage.getItem("epure-theme-mode");
        const root = document.documentElement;
        root.setAttribute("data-style", "orbit");
        try {
          localStorage.setItem("epure-style-theme", "orbit");
        } catch {}
        if (m === "dark") {
          root.classList.add("dark");
          root.classList.remove("light");
          root.setAttribute("data-theme", "dark");
        } else {
          root.classList.add("light");
          root.classList.remove("dark");
          root.setAttribute("data-theme", "light");
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- StyleX dev CSS (devMode: css-only — no virtual runtime; avoids Vite dep deadlock) -->
    <link rel="stylesheet" href="/virtual:stylex.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
