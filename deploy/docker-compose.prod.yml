# Production overlay — use with:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile tls up -d
#
# Run `./configure --prod` or copy `deploy/env.production.example` → `.env` first.
# Profile `tls` starts Caddy on ports 80 and 443. Omit it when you already
# terminate HTTPS yourself. Epure stays HTTP on EPURE_PORT.
# Example `epure:epure` passwords are refused. After migrate, the process sets
# ingest/app role passwords from the URLs below.

services:
  epure:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set me}
      DATABASE_URL: postgres://epure:${POSTGRES_PASSWORD}@postgres:5432/epure
      EPURE_INGEST_DATABASE_URL: postgres://epure_ingest:${EPURE_INGEST_PASSWORD:?set me}@postgres:5432/epure
      EPURE_APP_DATABASE_URL: postgres://epure_app:${EPURE_APP_PASSWORD:?set me}@postgres:5432/epure
      EPURE_ALLOW_EXAMPLE_PASSWORDS: "0"
      EPURE_SESSION_SECURE: "1"
      EPURE_PUBLIC_URL: ${EPURE_PUBLIC_URL:?set me}
      EPURE_CORS_ORIGINS: ${EPURE_CORS_ORIGINS:?set me}
      EPURE_DEV_SEED: ""
      EPURE_WEBHOOK_ALLOW_PRIVATE: ""
      # Comma-separated IPs or CIDRs of the reverse proxy. Empty keeps the TCP peer.
      EPURE_TRUSTED_PROXIES: ${EPURE_TRUSTED_PROXIES:-}
    ports:
      - "${EPURE_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EPURE_SITE_ADDRESS: ${EPURE_SITE_ADDRESS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - epure

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set me}
    ports: []

volumes:
  caddy_data:
  caddy_config:
