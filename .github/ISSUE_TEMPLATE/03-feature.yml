name: Feature request
description: Propose an Epure product improvement
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/epure-sh/epure/blob/main/CONTRIBUTING.md) scope guard first.
        This repo does **not** include Redis, Kafka, ClickHouse, tracing, replay, profiling, generic logs, or iOS/Android.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain are you solving? Who is affected?
      placeholder: "When triaging mobile crashes, I can't filter by..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction (optional)
      description: A sketch is fine — maintainers will scope against CONTRIBUTING.md.
    validations:
      required: false
  - type: dropdown
    id: roadmap-slice
    attributes:
      label: Closest area
      options:
        - Ingest / spike valve
        - Processing / sourcemaps
        - Storage / RLS
        - Dashboard / triage
        - Lifecycle / alerts
        - Admin / RBAC
        - Docs / DX
        - Not listed / unsure
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgment
      options:
        - label: I read CONTRIBUTING.md and this is not explicitly out of scope
        - label: I am willing to open a PR if maintainers accept the direction
