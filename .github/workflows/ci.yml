# PR and main checks: cargo test against Postgres 16.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epure
          POSTGRES_PASSWORD: epure
          POSTGRES_DB: epure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://epure:epure@localhost:5432/epure
      EPURE_INGEST_DATABASE_URL: postgres://epure_ingest:epure_ingest@localhost:5432/epure
      EPURE_APP_DATABASE_URL: postgres://epure_app:epure_app@localhost:5432/epure
      EPURE_SESSION_SECURE: "0"
      EPURE_BIND: 127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets (embedded in server binary)
        working-directory: web
        run: npm ci && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit
        run: cargo audit

      - name: Run tests
        run: cargo test
