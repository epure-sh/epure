# Operator knobs live in `.env` (copy from `.env.example`). Defaults below
# apply when that file is missing.
#
# `docker compose up` pulls ghcr.io/epure-sh/epure. Pin a release with
# EPURE_IMAGE. Source build (contributors): docker-compose.build.yml.

services:
  epure:
    image: ${EPURE_IMAGE:-ghcr.io/epure-sh/epure:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${EPURE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://epure:epure@postgres:5432/epure
      EPURE_INGEST_DATABASE_URL: postgres://epure_ingest:epure_ingest@postgres:5432/epure
      EPURE_APP_DATABASE_URL: postgres://epure_app:epure_app@postgres:5432/epure
      EPURE_BIND: 0.0.0.0:8080
      EPURE_MODE: all
      # Release image; documented local-dev passwords. Do not copy to prod overlay.
      EPURE_ALLOW_EXAMPLE_PASSWORDS: "1"
      EPURE_ARTIFACTS_DIR: /data/artifacts
      EPURE_SESSION_SECURE: ${EPURE_SESSION_SECURE:-0}
      EPURE_PUBLIC_URL: ${EPURE_PUBLIC_URL:-http://localhost:8080}
      EPURE_CORS_ORIGINS: ${EPURE_CORS_ORIGINS:-*}
      EPURE_DEV_SEED: ${EPURE_DEV_SEED:-}
      EPURE_WEBHOOK_ALLOW_PRIVATE: ${EPURE_WEBHOOK_ALLOW_PRIVATE:-}
      # Cloud only — leave empty for OSS.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - artifacts_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: epure
      POSTGRES_PASSWORD: epure
      POSTGRES_DB: epure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone can pass during Postgres first-boot init before the final restart.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U epure -d epure && psql -U epure -d epure -qtAc 'SELECT 1' | grep -q 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  artifacts_data:
