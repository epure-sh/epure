services:
  epure:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://epure:epure@postgres:5432/epure
      EPURE_INGEST_DATABASE_URL: postgres://epure_ingest:epure_ingest@postgres:5432/epure
      EPURE_APP_DATABASE_URL: postgres://epure_app:epure_app@postgres:5432/epure
      EPURE_BIND: 0.0.0.0:8080
      EPURE_MODE: all
      EPURE_ARTIFACTS_DIR: /data/artifacts
      EPURE_SESSION_SECURE: "0"
      EPURE_PUBLIC_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/v1/auth/google/callback
    volumes:
      - artifacts_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: epure
      POSTGRES_PASSWORD: epure
      POSTGRES_DB: epure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epure -d epure"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
  artifacts_data:
